[package]
name = "lmbp-mock"
version = "0.1.0"
edition = "2021"
description = "LMBP 1.0 mock SaaS gateway in Rust (std threads, in-memory state)"
publish = false

[[bin]]
name = "lmbp-mock"
path = "src/main.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
ed25519-dalek = "2"
sha2 = "0.10"
sha1 = "0.10"
base64 = "0.22"
getrandom = "0.2"
regex = { version = "1", default-features = false, features = ["std", "unicode"] }
parking_lot = "0.12"

[profile.release]
debug = false
