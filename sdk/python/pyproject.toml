[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lsp2-server"
version = "0.1.0"
description = "LSP2 server SDK: pair users' desktop apps and call their local models through OpenAI- and Anthropic-compatible APIs (ASGI)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["cryptography>=42", "segno>=1.6"]
keywords = ["lsp2", "llm", "openai", "anthropic", "asgi", "fastapi"]
classifiers = ["Framework :: AsyncIO", "Typing :: Typed", "Programming Language :: Python :: 3"]

[project.optional-dependencies]
server = ["uvicorn[standard]>=0.30"]
test = ["uvicorn[standard]>=0.30", "websockets>=12", "httpx>=0.27", "fastapi>=0.110", "pytest>=8", "pytest-asyncio>=0.23"]

[project.urls]
Repository = "https://github.com/tyro668/LocalSubProxy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lsp2_server = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
